    :root {

      --cyan:     #00d4ff;

      --sans:     'Space Grotesk', sans-serif;
      --ease:     cubic-bezier(0.22,1,0.36,1);

    html { scroll-behavior: smooth; overflow-x: hidden; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }

    ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.18); border-radius: 2px; }

    ::selection { background: rgba(0,212,255,0.18); color: #fff; }

    /* ── Custom cursor ── */
    #cur-dot {
      position: fixed; width: 7px; height: 7px;
      background: var(--cyan); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 8px var(--cyan), 0 0 20px rgba(0,212,255,0.4);
      transition: width .15s, height .15s, opacity .2s;
    }
    #cur-ring {
      position: fixed; width: 38px; height: 38px;
      border: 1px solid rgba(0,212,255,0.35); border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      transition: width .3s var(--ease), height .3s var(--ease), border-color .25s, opacity .2s;
    }
    .cursor-expand #cur-dot  { width: 12px; height: 12px; }
    .cursor-expand #cur-ring { width: 56px; height: 56px; border-color: rgba(0,212,255,0.55); }

    /* ── Progress bar ── */
    #prog {
      position: fixed; top: 0; left: 0; height: 2px; z-index: 200;
      background: linear-gradient(90deg, #1e3a8a, #00d4ff 50%, #f0a429);
      box-shadow: 0 0 12px rgba(0,212,255,0.6), 0 0 24px rgba(240,164,41,0.3);
      transform-origin: left; transform: scaleX(0);
      transition: transform .05s linear;
      width: 100%;
    }

    /* ── HUD grid ── */
    .hud-grid {
      background-image:
        linear-gradient(rgba(0,212,255,0.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.016) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    /* ── Clip corner ── */
    .clip-lg { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
    .clip-sm { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); }

    /* ── Glow ── */
    .glow    { text-shadow: 0 0 22px rgba(0,212,255,0.55), 0 0 60px rgba(0,212,255,0.18); }
    .glow-sm { text-shadow: 0 0 10px rgba(0,212,255,0.45); }

    /* ── Keyframes ── */
    @keyframes fadeUp   { from{opacity:0;transform:translateY(32px)} to{opacity:1;transform:translateY(0)} }
    @keyframes charIn   { from{opacity:0;transform:translateY(36px) rotateX(-55deg);filter:blur(3px)} to{opacity:1;transform:none;filter:blur(0)} }
    @keyframes scanLine { 0%{top:-4px;opacity:0} 4%{opacity:.9} 88%{opacity:.25} 100%{top:110%;opacity:0} }
    @keyframes pulseDot { 0%,100%{opacity:.3;transform:scale(1);box-shadow:none} 50%{opacity:1;transform:scale(1.55);box-shadow:0 0 6px 2px rgba(0,212,255,.55)} }
    @keyframes orbitCW  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes orbitCCW { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
    @keyframes radarSpin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes blinkBar { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes floatOrb { 0%,100%{transform:translateY(0) scale(1);opacity:.07} 50%{transform:translateY(-28px) scale(1.04);opacity:.13} }
    @keyframes scrollBounce { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(10px);opacity:1} }
    @keyframes shimmer  { 0%{background-position:-200% center} 100%{background-position:200% center} }
    @keyframes glitchA  {
      0%  {clip-path:polygon(0 0%,100% 0%,100% 30%,0 30%);transform:translateX(-3px)}
      30% {clip-path:polygon(0 30%,100% 30%,100% 65%,0 65%);transform:translateX(3px)}
      65% {clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);transform:translateX(-2px)}
      100%{clip-path:polygon(0 0%,100% 0%,100% 100%,0 100%);transform:translateX(0)}
    }
    @keyframes glitchB  {
      0%  {clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);transform:translateX(3px);color:rgba(0,212,255,.75)}
      35% {clip-path:polygon(0 0%,100% 0%,100% 30%,0 30%);transform:translateX(-2px);color:rgba(255,80,80,.6)}
      70% {clip-path:polygon(0 30%,100% 30%,100% 65%,0 65%);transform:translateX(2px)}
      100%{clip-path:polygon(0 0%,100% 0%,100% 100%,0 100%);transform:translateX(0)}
    }

    /* ── Scroll-reveal ── */
    .sr { opacity:0; transform:translateY(28px); transition:opacity .7s var(--ease), transform .7s var(--ease); }
    .sr.in  { opacity:1; transform:translateY(0); }
    .sr.d1  { transition-delay:.08s }
    .sr.d2  { transition-delay:.16s }
    .sr.d3  { transition-delay:.24s }
    .sr.d4  { transition-delay:.32s }
    .sr.d5  { transition-delay:.40s }

    /* Clip wipe */
    .cw     { clip-path:inset(0 100% 0 0); transition:clip-path .8s var(--ease); }
    .cw.in  { clip-path:inset(0 0% 0 0); }

    /* ── Scan line ── */
    .scan-line { animation: scanLine 7s linear infinite; }

    /* ── Pulse dot ── */
    .p-dot { animation: pulseDot 2.5s ease-in-out infinite; }

    /* ── Boot cursor ── */
    .boot-caret { display:inline-block; width:8px; height:1.1em; background:var(--cyan); vertical-align:text-bottom; animation:blinkBar .75s step-end infinite; }

    /* ── Glitch (applied via JS class) ── */
    .glitch { position:relative; }
    .glitch::before, .glitch::after {
      content: attr(data-text); position:absolute; inset:0; opacity:0; pointer-events:none;
    }
    .glitch:hover::before { opacity:1; animation:glitchA .45s steps(1) forwards; color:rgba(0,212,255,.7); }
    .glitch:hover::after  { opacity:1; animation:glitchB .45s steps(1) forwards; color:rgba(255,70,70,.6); }

    /* ── Card ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: border-color .3s, box-shadow .3s;
    }
    .card:hover {
      border-color: rgba(0,212,255,.22);
      box-shadow: 0 0 40px rgba(0,212,255,.07), 0 16px 40px rgba(0,0,0,.4);
    }

    /* ── Buttons ── */
    .btn-p {
      position:relative; display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:13px 26px;
      background:rgba(0,212,255,.07); border:1px solid rgba(0,212,255,.28); color:rgba(0,212,255,.9);
      font-family:var(--mono); font-size:.68rem; letter-spacing:.2em; text-transform:uppercase;
      overflow:hidden; transition:background .3s, border-color .3s, color .3s, transform .4s var(--ease);
    }
    .btn-p::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(120deg, rgba(0,212,255,.14) 0%, transparent 55%);
      transform:translateX(-110%); transition:transform .5s var(--ease);
    }
    .btn-p:hover { background:rgba(0,212,255,.13); border-color:rgba(0,212,255,.5); color:#00d4ff; }
    .btn-p:hover::before { transform:translateX(0); }

    .btn-s {
      position:relative; display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:13px 26px;
      background:transparent; border:1px solid rgba(255,255,255,.09); color:rgba(200,215,235,.75);
      font-family:var(--mono); font-size:.68rem; letter-spacing:.2em; text-transform:uppercase;
      transition:border-color .3s, color .3s, transform .4s var(--ease);

    .btn-s:hover { border-color:rgba(255,255,255,.25); color:#fff; }

    /* ── Tech badge ── */
    .badge {
      font-family:var(--mono); font-size:.7rem; padding:3px 9px; display:inline-block;
      transition:transform .2s var(--ease), box-shadow .2s;

    .badge:hover { transform:translateY(-2px) scale(1.07); }

    /* ── Section label ── */
    .sec-lbl { font-family:var(--mono); font-size:.66rem; color:rgba(0,212,255,.7); letter-spacing:.28em; text-transform:uppercase; margin-bottom:12px; }

    /* ── Stat card ── */
    .stat-card {
      background:rgba(6,10,22,.55); border:1px solid rgba(255,255,255,.05);
      padding:28px 18px; text-align:center;
      transition:border-color .3s, box-shadow .3s;

    .stat-card:hover { border-color:rgba(0,212,255,.18); box-shadow:0 0 28px rgba(0,212,255,.06); }
    .stat-val  { font-size:1.9rem; font-weight:700; color:var(--cyan); text-shadow:0 0 14px rgba(0,212,255,.4); margin-bottom:5px; }
    .stat-lbl  { font-family:var(--mono); font-size:.6rem; color:var(--txt-2); letter-spacing:.2em; text-transform:uppercase; }

    /* ── Orbit / profile ── */
    .orbit-outer {
      position:absolute; inset:-22px; border-radius:50%;

    .orbit-inner {

    /* ── CTA row full-width on small screens ── */
    @media(max-width:400px){

      .contact-links > a { justify-content:center !important; }
    }

<!-- Runtime utilities (pure JS, no React needed) -->
<script>
/* ── Custom cursor ── */
(function(){
  var dot = document.getElementById('cur-dot');
  var ring = document.getElementById('cur-ring');
  if (!dot || !ring) return;
  var mx=-999,my=-999,rx=-999,ry=-999;
  document.addEventListener('mousemove', function(e){
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+'px'; dot.style.top=my+'px';
  });
  (function tick(){
    rx+=(mx-rx)*.11; ry+=(my-ry)*.11;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(tick);
  })();
  document.addEventListener('mouseover',function(e){
    if(e.target.closest('a,button,[data-hover]')) document.body.classList.add('cursor-expand');
  });
  document.addEventListener('mouseout',function(e){
    if(e.target.closest('a,button,[data-hover]')) document.body.classList.remove('cursor-expand');
  });
})();

/* ── Scroll progress ── */
(function(){
  var bar=document.getElementById('prog');
  window.addEventListener('scroll',function(){
    var s=window.scrollY, t=document.documentElement.scrollHeight-window.innerHeight;
    bar.style.transform='scaleX('+(t>0?s/t:0)+')';
  },{passive:true});
})();

/* ── IntersectionObserver for .sr and .cw ── */
window._initSR = function(){
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  },{threshold:0.1});
  document.querySelectorAll('.sr,.cw').forEach(function(el){ io.observe(el); });
};

/* ── TextScramble ── */
window.TextScramble = function(el){
  this.el=el; this.chars='!<>_\\/[]{}—=+*^?#~'; this.frame=0; this.queue=[];
  var self=this;
  this.update=function(){
    var html='',complete=0,n=self.queue.length;
    for(var i=0;i<n;i++){
      var item=self.queue[i];
      if(self.frame>=item.end){ complete++; html+=item.to; }
      else if(self.frame>=item.start){
        if(!item.char||Math.random()<.28){ item.char=self.chars[Math.floor(Math.random()*self.chars.length)]; }
        html+='<span style="color:rgba(0,212,255,.45)">'+item.char+'</span>';
      } else { html+='<span style="opacity:.2">'+item.to+'</span>'; }
    }
    self.el.innerHTML=html;
    if(complete===n){ self.resolve(); } else { self.frameReq=requestAnimationFrame(self.update); self.frame++; }
  };
  this.setText=function(text){
    return new Promise(function(resolve){
      self.resolve=resolve; self.queue=[]; self.frame=0;
      cancelAnimationFrame(self.frameReq);
      for(var i=0;i<text.length;i++){
        var start=Math.floor(Math.random()*14);
        self.queue.push({to:text[i],start:start,end:start+Math.floor(Math.random()*14)+4,char:''});
      }
      self.update();
    });
  };
};

/* ── Count-up ── */
window._countUp = function(el, target, dur){
  dur = dur||1400;
  var num=parseFloat(target), isNum=!isNaN(num);
  if(!isNum){ el.textContent=target; return; }
  var suf=target.replace(String(Math.floor(num)),''), start=performance.now();
  (function tick(now){
    var p=Math.min((now-start)/dur,1), e=1-Math.pow(1-p,3);
    el.textContent=Math.floor(num*e)+suf;
    if(p<1) requestAnimationFrame(tick);
  })(start);
};

/* ── Particle system ── */
window.Particles = function(canvas){
  var ctx=canvas.getContext('2d');
  var pts=[], mouse={x:-999,y:-999}, raf;

  function resize(){
    canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight;
  }
  function init(){
    pts=[];
    var n=Math.min(Math.floor(canvas.width*canvas.height/15000),75);
    for(var i=0;i<n;i++) pts.push({
      x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      vx:(Math.random()-.5)*.22, vy:(Math.random()-.5)*.22,
      s:Math.random()*1.1+.4, o:Math.random()*.32+.07
    });
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      /* mouse repel */
      var dmx=p.x-mouse.x, dmy=p.y-mouse.y, dm=Math.sqrt(dmx*dmx+dmy*dmy);
      if(dm<90){ var f=(90-dm)/90; p.vx+=dmx/dm*f*.28; p.vy+=dmy/dm*f*.28; }
      /* clamp speed */
      var sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
      if(sp>1.4){ p.vx*=.92; p.vy*=.92; }
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>canvas.width)  p.vx*=-1;
      if(p.y<0||p.y>canvas.height) p.vy*=-1;
      /* connections */
      for(var j=i+1;j<pts.length;j++){
        var q=pts[j], dx=p.x-q.x, dy=p.y-q.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<140){ ctx.beginPath(); ctx.strokeStyle='rgba(0,212,255,'+(1-d/140)*.065+')'; ctx.lineWidth=.7; ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); }
      }
      /* dot */
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
      ctx.fillStyle='rgba(0,212,255,'+p.o+')'; ctx.fill();
    }
    raf=requestAnimationFrame(draw);
  }
  var ro=new ResizeObserver(function(){ resize(); init(); });
  ro.observe(canvas);
  resize(); init(); draw();
  canvas.closest('section')&&canvas.closest('section').addEventListener('mousemove',function(e){
    var r=canvas.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
  });
  this.destroy=function(){ cancelAnimationFrame(raf); ro.disconnect(); };
};

/* ── 3-D card tilt ── */
window._tilt = function(el){
  if(!el) return;
  el.addEventListener('mousemove',function(e){
    var r=el.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    el.style.transform='perspective(900px) rotateY('+(x*8)+'deg) rotateX('+(-y*8)+'deg) translateZ(8px)';
    el.style.transition='transform .08s linear';
  });
  el.addEventListener('mouseleave',function(){
    el.style.transform='perspective(900px) rotateY(0deg) rotateX(0deg) translateZ(0)';
    el.style.transition='transform .55s cubic-bezier(.22,1,.36,1)';
  });
};
</script>

<script type="text/babel">
// ─── Language Context ─────────────────────────────────────────────────────────
const LangContext = React.createContext({ lang:'en', toggle:()=>{} });
window.LangContext = LangContext;

// ─── TechBadge ────────────────────────────────────────────────────────────────
function TechBadge({ tech, xs }) {
  const s = (window.TECH_COLORS||{})[tech] || window.BADGE_DEFAULT;
  return (
    <span className="badge" style={{ background:s.bg, border:`1px solid ${s.border}`, color:s.text, fontSize: xs?'.65rem':'.7rem', padding: xs?'2px 7px':'3px 9px' }}>
      {tech}
    </span>
  );
}
window.TechBadge = TechBadge;

// ─── SectionHeader ────────────────────────────────────────────────────────────
function SectionHeader({ label, title, id }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        io.disconnect();
        const scrambler = new window.TextScramble(el);
        scrambler.setText(title);
      }
    }, { threshold: 0.5 });
    io.observe(el);
    return () => io.disconnect();
  }, [title]);

  return (
    <div className="sr" style={{ marginBottom:'48px' }}>
      <p className="sec-lbl">{label}</p>
      <h2 ref={ref} id={id} style={{ fontSize:'clamp(1.6rem,4vw,2.6rem)', fontWeight:700, color:'var(--txt-1)', letterSpacing:'-.02em', lineHeight:1.1, minHeight:'1.2em' }}>
        {title}
      </h2>
      <div style={{ marginTop:'14px', display:'flex', alignItems:'center', gap:'12px' }}>
        <div style={{ width:'40px', height:'1px', background:'rgba(0,212,255,.5)', boxShadow:'0 0 8px rgba(0,212,255,.3)' }} />
        <div style={{ flex:1, height:'1px', background:'rgba(255,255,255,.035)' }} />
      </div>
    </div>
  );
}
window.SectionHeader = SectionHeader;

// ─── LangToggle ───────────────────────────────────────────────────────────────
function LangToggle({ compact }) {
  const { lang, toggle } = React.useContext(LangContext);
  const [hover, setHover] = React.useState(false);
  const btnStyle = {
    position:'relative', display:'flex', alignItems:'center', justifyContent:'center',
    fontFamily:'var(--mono)', fontSize: compact ? '.58rem' : '.62rem',
    letterSpacing: compact ? '.1em' : '.18em', textTransform:'uppercase',
    border:`1px solid ${hover?'rgba(0,212,255,.28)':'rgba(255,255,255,.08)'}`,
    color: hover?'rgba(0,212,255,.9)':'rgba(120,145,175,.8)',
    padding: compact ? '6px 8px' : '6px 12px',
    background: hover?'rgba(0,212,255,.06)':'transparent',
    transition:'all .25s', overflow:'hidden', flexShrink:0, gap: compact ? 0 : '6px',
  };
  if (compact) {
    return (
      <button className="lang-toggle-compact" onClick={toggle} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={btnStyle} aria-label="Toggle language">
        <span style={{ color:'rgba(0,212,255,.75)' }}>{lang==='en'?'EN':'PT'}</span>
      </button>
    );
  }
  return (
    <button className="lang-toggle-full" onClick={toggle} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={btnStyle}>
      {hover && <span style={{ position:'absolute', inset:0, top:0, height:'1px', background:'linear-gradient(90deg,transparent,rgba(0,212,255,.4),transparent)', pointerEvents:'none' }} />}
      <span style={{ color:'rgba(0,212,255,.65)' }}>{lang==='en'?'EN':'PT'}</span>
      <span style={{ color:'rgba(255,255,255,.2)' }}>{'→'}</span>
      <span style={{ color:'rgba(100,130,165,.5)' }}>{lang==='en'?'PT':'EN'}</span>
    </button>
  );
}

// ─── NavBar ───────────────────────────────────────────────────────────────────
function NavBar() {
  const { lang } = React.useContext(LangContext);
  const c = window.CONTENT[lang];
  const [scrolled, setScrolled] = React.useState(false);
  const [active, setActive] = React.useState('');
  const [menuOpen, setMenuOpen] = React.useState(false);
  const menuOpenRef = React.useRef(false);

  React.useEffect(() => { menuOpenRef.current = menuOpen; }, [menuOpen]);

  React.useEffect(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 50);
      const sections = document.querySelectorAll('section[id]');
      let cur = '';
      sections.forEach(s => { if (window.scrollY >= s.offsetTop - 100) cur = s.id; });
      setActive(cur);
      if (menuOpenRef.current) setMenuOpen(false);
    };
    window.addEventListener('scroll', onScroll, { passive:true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  React.useEffect(() => {
    const nav = document.getElementById('nav');
    if (nav) nav.className = scrolled ? 'scrolled' : '';
  }, [scrolled]);

  return (
    <nav id="nav" style={{ opacity:0, transform:'translateY(-56px)', animation:'fadeUp .6s .05s var(--ease) forwards' }}>
      <div id="nav-inner">
        <span className="nav-brand">PORT_OS</span>
        <ul className="hide-mobile" style={{ gap:'clamp(16px,3vw,32px)', listStyle:'none', alignItems:'center', margin:0, padding:0 }}>
          {c.navLinks.map(link => (
            <li key={link.href}>
              <a href={link.href} style={{
                fontFamily:'var(--mono)', fontSize:'.68rem', letterSpacing:'.14em', textTransform:'uppercase',
                color: active===link.href.slice(1) ? 'var(--cyan)' : 'rgba(120,145,175,.75)',
                transition:'color .2s', whiteSpace:'nowrap',
              }}
              onMouseEnter={e=>e.target.style.color='var(--cyan)'}
              onMouseLeave={e=>e.target.style.color=active===link.href.slice(1)?'var(--cyan)':'rgba(120,145,175,.75)'}
              >{link.label}</a>
            </li>
          ))}
        </ul>
        <div className="nav-actions">
          <LangToggle compact />
          <LangToggle />
          <button
            className="show-mob"
            onClick={() => setMenuOpen(o => !o)}
            aria-label="Abrir menu"
            aria-expanded={menuOpen}
            style={{
              display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', gap:'5px',
              width:'36px', height:'36px', cursor:'pointer', padding:'4px', flexShrink:0,
              border:`1px solid ${menuOpen ? 'rgba(0,212,255,.35)' : 'rgba(0,212,255,.15)'}`,
              background: menuOpen ? 'rgba(0,212,255,.06)' : 'transparent',
              transition:'border-color .2s, background .2s',
            }}
          >
            <span style={{ display:'block', width:'16px', height:'1px', background:'rgba(0,212,255,.65)', transition:'transform .25s, opacity .2s', transform: menuOpen ? 'translateY(6px) rotate(45deg)' : 'none' }} />
            <span style={{ display:'block', width:'16px', height:'1px', background:'rgba(0,212,255,.65)', transition:'opacity .2s', opacity: menuOpen ? 0 : 1 }} />
            <span style={{ display:'block', width:'16px', height:'1px', background:'rgba(0,212,255,.65)', transition:'transform .25s, opacity .2s', transform: menuOpen ? 'translateY(-6px) rotate(-45deg)' : 'none' }} />
          </button>
        </div>
      </div>
      {menuOpen && (
        <div className="mob-menu">
          <ul style={{ listStyle:'none', padding:0, margin:0 }}>
            {c.navLinks.map(link => (
              <li key={link.href}>
                <a
                  href={link.href}
                  onClick={() => setMenuOpen(false)}
                  className={active === link.href.slice(1) ? 'mob-active' : ''}
                >
                  {link.label}
                </a>
              </li>
            ))}
          </ul>
        </div>
      )}
    </nav>
  );
}
window.NavBar = NavBar;

// ─── HeroSection ──────────────────────────────────────────────────────────────
function HeroSection() {
  const { lang } = React.useContext(LangContext);
  const c = window.CONTENT[lang];
  const h = c.hero;

  const [heroVisible, setHeroVisible] = React.useState(false);
  const canvasRef = React.useRef(null);
  const particlesRef = React.useRef(null);
  const bootLines = window.CONTENT[lang].bootLines;
  const BOOT_DURATION = bootLines.length * 220 + 300; // ms until hero reveals

  /* Boot then reveal hero */
  React.useEffect(() => {
    setHeroVisible(false);
    const t = setTimeout(() => setHeroVisible(true), BOOT_DURATION);
    return () => clearTimeout(t);
  }, [lang, BOOT_DURATION]);

  /* Canvas particles */
  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    if (particlesRef.current) { particlesRef.current.destroy(); particlesRef.current=null; }
    particlesRef.current = new window.Particles(canvas);
    return () => { if(particlesRef.current) { particlesRef.current.destroy(); particlesRef.current=null; } };
  }, []);

  /* Init scroll animations after hero mounts */
  React.useEffect(() => {
    if (heroVisible) setTimeout(()=>window._initSR&&window._initSR(), 600);
  }, [heroVisible]);

  const name = h.name;

  return (
    <section id="home" style={{ position:'relative', minHeight:'100vh', display:'flex', flexDirection:'column', justifyContent:'center', overflow:'hidden' }} className="hud-grid">
      {/* Canvas background */}
      <canvas ref={canvasRef} style={{ position:'absolute', inset:0, width:'100%', height:'100%', pointerEvents:'none' }} />
      {/* Radial glow */}
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 50% -5%, rgba(0,212,255,.1) 0%, transparent 60%)', pointerEvents:'none' }} />
      {/* Ambient orbs */}
      <div className="amb" style={{ width:'500px', height:'500px', background:'rgba(0,212,255,.07)', top:'-150px', left:'-100px', animationDelay:'0s' }} />
      <div className="amb" style={{ width:'400px', height:'400px', background:'rgba(124,111,255,.05)', bottom:'-100px', right:'-80px', animationDelay:'-4s' }} />

      {/* HUD corners */}
      {[['top:88px','left:24px','T'],['top:88px','right:24px','T'],['bottom:80px','left:24px','B'],['bottom:80px','right:24px','B']].map(([pos1,pos2,tb],i)=>{
        const [k1,v1]=pos1.split(':'), [k2,v2]=pos2.split(':');
        const side=k2==='left'?'L':'R';
        return <div key={i} style={{ position:'absolute', [k1]:v1+'px',[k2]:v2+'px', width:16, height:16, [`border${side==='L'?'Left':'Right'}`]:'1px solid rgba(0,212,255,.18)', [`border${tb==='T'?'Top':'Bottom'}`]:'1px solid rgba(0,212,255,.18)' }} />;
      })}

      <div className="c" style={{ position:'relative', paddingTop:'120px', paddingBottom:'100px', width:'100%' }}>
        {/* Boot lines — CSS stagger */}
        <div className="boot-lines" style={{ fontFamily:'var(--mono)', fontSize:'.72rem', lineHeight:'1.9', marginBottom:'48px', minHeight:'5.5rem' }}>
          {bootLines.map((line, i) => (
            <p key={`${lang}-${i}`} style={{
              color: line.startsWith('[ OK ]') ? 'rgba(0,212,255,.7)' : 'rgba(100,130,165,.65)',
              opacity: 0,
              animation: `fadeUp .35s ${60 + i * 200}ms var(--ease) both`,
              display: 'flex', alignItems: 'center', gap: '6px',
            }}>
              {line}
              {i === bootLines.length - 1 && !heroVisible && <span className="boot-caret" />}
            </p>
          ))}
        </div>

        {/* Hero content */}
        {heroVisible && (
          <div style={{ display:'flex', flexDirection:'column', gap:'0' }}>
            {/* Mobile profile photo — hidden at 900px+ */}
            <div className="hero-photo-mob" style={{ opacity:0, animation:'fadeUp .6s .1s var(--ease) forwards' }}>
              <ProfilePhoto size={140} />
            </div>

            {/* Role */}
            <div style={{ opacity:0, animation:'fadeUp .5s .05s var(--ease) forwards', marginBottom:'20px' }}>
              <span style={{ fontFamily:'var(--mono)', fontSize:'.68rem', letterSpacing:'.22em', textTransform:'uppercase', color:'rgba(0,212,255,.75)', border:'1px solid rgba(0,212,255,.18)', padding:'5px 14px', display:'inline-block' }}>
                {h.role}
              </span>
            </div>

            {/* Layout row: text + photo */}
            <div style={{ display:'flex', flexDirection:'column', gap:'40px', alignItems:'flex-start' }}>
              <div style={{ flex:1, minWidth:0 }}>
                {/* Name — character stagger */}
                <div style={{ opacity:0, animation:'fadeUp .6s .15s var(--ease) forwards', marginBottom:'20px', perspective:'600px' }}>
                  <h1 className="glitch glow" data-text={name} style={{ fontSize:'clamp(2.8rem,8vw,5.5rem)', fontWeight:700, letterSpacing:'-.03em', lineHeight:.92, color:'var(--txt-1)', display:'flex', flexWrap:'wrap' }}>
                    {name.split('').map((ch,i)=>(
                      <span key={i} style={{ display:'inline-block', opacity:0, animation:`charIn .55s ${.2+i*.04}s var(--ease) forwards`, whiteSpace: ch===' '?'pre':'normal' }}>{ch===' '?'\u00A0':ch}</span>
                    ))}
                  </h1>
                </div>

                {/* Tagline */}
                <p style={{ opacity:0, animation:'fadeUp .6s .42s var(--ease) forwards', fontSize:'clamp(1.05rem,2.5vw,1.45rem)', color:'rgba(220,235,250,.9)', maxWidth:'640px', lineHeight:1.35, marginBottom:'14px', fontWeight:500 }}>
                  {h.tagline}
                </p>

                {/* Description */}
                <p style={{ opacity:0, animation:'fadeUp .6s .54s var(--ease) forwards', fontSize:'clamp(.88rem,1.6vw,1rem)', color:'var(--txt-2)', maxWidth:'560px', lineHeight:1.75, marginBottom:'40px' }}>
                  {h.description}
                </p>

                {/* CTAs */}
                <div className="cta-row" style={{ opacity:0, animation:'fadeUp .5s .66s var(--ease) forwards', display:'flex', flexWrap:'wrap', gap:'12px' }}>
                  <a href="#featured" className="btn-p clip-sm">
                    {h.ctaPrimary} <span style={{ color:'rgba(0,212,255,.5)' }}>→</span>
                  </a>
                  <a href="#contact" className="btn-s clip-sm">
                    {h.ctaSecondary}
                  </a>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Profile photo — floating right on large screens */}
      {heroVisible && (
        <div style={{ position:'absolute', right:'clamp(40px,8vw,120px)', top:'50%', transform:'translateY(-50%)', opacity:0, animation:'fadeUp .7s .3s var(--ease) forwards', display:'none' }} className="show-lg">
          <ProfilePhoto size={220} />
        </div>
      )}

      {/* HUD labels */}

function ProjectsSection() {
  const { lang } = React.useContext(window.LangContext);
  const proj = window.CONTENT[lang].projects;
  const labels = { problem:proj.problemLabel, solution:proj.solutionLabel, github:proj.githubLabel, demo:proj.demoLabel };

  const [activeFilter, setActiveFilter] = React.useState('all');

  React.useEffect(() => { setActiveFilter('all'); }, [lang]);

  const allLabel = lang === 'pt' ? 'Todos' : 'All';
  const categories = React.useMemo(() => {
    const seen = new Set();
    proj.items.forEach(item => { if (item.category) seen.add(item.category); });
    return Array.from(seen);
  }, [proj]);

  const filtered = activeFilter === 'all'
    ? proj.items
    : proj.items.filter(item => item.category === activeFilter);

  return (
    <section id="projects" style={{ position:'relative', padding:'clamp(80px,10vw,120px) 0' }} className="hud-grid">
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 100% 50%, rgba(0,212,255,.042) 0%, transparent 55%)', pointerEvents:'none' }} />

        {/* Filter bar */}
        <div style={{ display:'flex', flexWrap:'wrap', gap:'8px', marginTop:'-24px', marginBottom:'36px' }}>
          {[allLabel, ...categories].map(cat => {
            const isActive = cat === allLabel ? activeFilter === 'all' : activeFilter === cat;
            return (
              <button
                key={cat}
                onClick={() => setActiveFilter(cat === allLabel ? 'all' : cat)}
                style={{
                  fontFamily:'var(--mono)', fontSize:'.62rem', letterSpacing:'.16em',
                  textTransform:'uppercase', padding:'5px 14px',
                  border:`1px solid ${isActive ? 'rgba(0,212,255,.45)' : 'rgba(0,212,255,.12)'}`,
                  background: isActive ? 'rgba(0,212,255,.08)' : 'transparent',
                  color: isActive ? 'rgba(0,212,255,.95)' : 'rgba(120,145,175,.65)',
                  cursor:'pointer', transition:'all .2s',

                onMouseEnter={e => { if (!isActive) { e.currentTarget.style.borderColor='rgba(0,212,255,.28)'; e.currentTarget.style.color='rgba(160,190,220,.9)'; } }}
                onMouseLeave={e => { if (!isActive) { e.currentTarget.style.borderColor='rgba(0,212,255,.12)'; e.currentTarget.style.color='rgba(120,145,175,.65)'; } }}
              >
                {cat}
              </button>
            );
          })}
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(min(300px,100%),1fr))', gap:'14px' }}>
          {filtered.map((item,i) => (
            <ProjectCard key={item.title} project={item} delay={(i%5)+1} labels={labels} />
          ))}
        </div>
      </div>
    </section>
  );
}

// ─── About Section ────────────────────────────────────────────────────────────
function AboutSection() {
  const { lang } = React.useContext(window.LangContext);
  const ab = window.CONTENT[lang].about;
  const hero = window.CONTENT[lang].hero;
  const statsRef = React.useRef([]);
  const statsObserved = React.useRef(false);

  React.useEffect(() => {
    if (statsObserved.current) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        statsObserved.current = true;
        io.disconnect();
        statsRef.current.forEach((el, i) => {
          if (el) setTimeout(() => window._countUp(el, ab.stats[i].value), i * 120);
        });
      }
    }, { threshold: 0.4 });
    const section = document.getElementById('about');
    if (section) io.observe(section);
    return () => io.disconnect();
  }, [ab]);

  return (
    <section id="about" style={{ position:'relative', padding:'clamp(80px,10vw,120px) 0' }} className="hud-grid">
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 50% 100%, rgba(0,212,255,.05) 0%, transparent 55%)', pointerEvents:'none' }} />
      <div className="c" style={{ position:'relative' }}>

                <p style={{ fontWeight:600, fontSize:'.98rem', color:'var(--txt-1)', marginBottom:'2px' }}>Luiz Wessel</p>
                <p style={{ fontFamily:'var(--mono)', fontSize:'.65rem', color:'var(--txt-2)' }}>{hero.role}</p>
              </div>
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:'16px', marginBottom:'24px' }}>
              {ab.bio.map((p,i)=>(
                <p key={i} style={{ fontSize:'.92rem', color:'var(--txt-2)', lineHeight:1.8 }}>{p}</p>
              ))}
            </div>

            <div style={{ borderTop:'1px solid rgba(255,255,255,.055)', paddingTop:'20px' }}>
              <p style={{ fontFamily:'var(--mono)', fontSize:'.6rem', letterSpacing:'.22em', textTransform:'uppercase', color:'rgba(0,212,255,.55)', marginBottom:'8px' }}>{ab.signalLabel}</p>

          <div className="sr d2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }}>
            {ab.stats.map((stat,i) => (
              <div key={stat.label} className="stat-card clip-sm">

  const [fading, setFading] = React.useState(false);

  const toggle = React.useCallback(() => {
    setFading(true);
    setTimeout(() => { setLang(l => l==='en'?'pt':'en'); setFading(false); }, 160);
  }, []);

  React.useEffect(() => {
    // Re-init scroll animations after lang change
    setTimeout(() => window._initSR && window._initSR(), 800);
  }, [lang]);

  return (
    <window.LangContext.Provider value={{ lang, toggle }}>
      <div style={{ opacity: fading ? 0.08 : 1, transition:'opacity .15s', background:'var(--bg)', minHeight:'100vh' }}>
        <window.NavBar />
        <window.HeroSection />
        <FeaturedProject />
        <ProjectsSection />
        <SkillsSection />
        <AboutSection />
        <ContactSection />
      </div>
    </window.LangContext.Provider>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Init scroll animations after first paint
setTimeout(() => window._initSR && window._initSR(), 1200);

</script>

</body>
</html>
